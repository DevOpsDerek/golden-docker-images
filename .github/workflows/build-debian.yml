# Build and optionally push golden Debian images.
# Monthly schedule (1st): builds and pushes with CalVer tags (e.g. bookworm-2025-03).

name: Build Debian Golden Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

env:
  VERSIONS: "bullseye bookworm"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: debian-golden-images
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set CalVer (monthly run)
        if: github.event_name == 'schedule'
        run: echo "CALVER=$(date +%Y-%m)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/build-metadata"
          for v in $VERSIONS; do
            docker buildx build --load \
              --metadata-file "$GITHUB_WORKSPACE/artifacts/build-metadata/$v.json" \
              -t debian-golden:$v ./$v
          done

      - name: Test images
        run: ./tests/test.sh debian-golden

      - name: Generate SBOM artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/sbom"
          for v in $VERSIONS; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$GITHUB_WORKSPACE/artifacts:/out" \
              aquasec/trivy:latest image \
              --format cyclonedx \
              --output "/out/sbom/$v.cdx.json" \
              debian-golden:$v
          done

      - name: Upload SBOM and build metadata artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-golden-build-evidence-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/artifacts/sbom/*.json
            ${{ github.workspace }}/artifacts/build-metadata/*.json
          if-no-files-found: error

      - name: Run Trivy vulnerability scanner
        run: |
          for v in $VERSIONS; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
              debian-golden:$v
          done

      - name: Determine if push should run
        id: determine_push
        run: |
          if [[ "$EVENT" == "schedule" ]]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
            echo "Push: yes (scheduled run)"
            exit 0
          fi
          if [[ "$EVENT" != "push" && "$EVENT" != "workflow_dispatch" ]]; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            echo "Push: no (event is $EVENT)"
            exit 0
          fi
          ref_expected="refs/heads/${DEFAULT_BRANCH:-main}"
          if [[ "$GITHUB_REF" != "$ref_expected" ]]; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            echo "Push: no (ref $GITHUB_REF is not default branch $DEFAULT_BRANCH)"
            exit 0
          fi
          echo "should_push=true" >> "$GITHUB_OUTPUT"
          echo "Push: yes (merge to default branch)"
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Push to registry (only on merge to default branch or monthly schedule)
        if: steps.determine_push.outputs.should_push == 'true'
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          REPO_OWNER_LOWER=$(echo "$GITHUB_REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          GHCR_REGISTRY="${REGISTRY_GHCR:-ghcr.io/$REPO_OWNER_LOWER/debian-golden}"
          for v in $VERSIONS; do
            docker tag debian-golden:$v $GHCR_REGISTRY:$v
            docker push $GHCR_REGISTRY:$v
            if [[ -n "${CALVER:-}" ]]; then
              docker tag debian-golden:$v $GHCR_REGISTRY:$v-$CALVER
              docker push $GHCR_REGISTRY:$v-$CALVER
            fi
          done
          if [[ -n "${DOCKERHUB_NAMESPACE:-}" ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
            DOCKERHUB_REGISTRY="docker.io/$DOCKERHUB_NAMESPACE/debian-golden"
            for v in $VERSIONS; do
              docker tag debian-golden:$v $DOCKERHUB_REGISTRY:$v
              docker push $DOCKERHUB_REGISTRY:$v
              if [[ -n "${CALVER:-}" ]]; then
                docker tag debian-golden:$v $DOCKERHUB_REGISTRY:$v-$CALVER
                docker push $DOCKERHUB_REGISTRY:$v-$CALVER
              fi
            done
          fi
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          REGISTRY_GHCR: ${{ vars.REGISTRY_GHCR || '' }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || '' }}
          CALVER: ${{ env.CALVER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

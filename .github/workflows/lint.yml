# Run pre-commit (all hooks: ShellCheck, Hadolint, yamllint, etc.) so CI matches local.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-agentic-workflows:
    name: Validate GitHub automation
    uses: DevOpsDerek/workflows/.github/workflows/validate-agentic-workflows.yml@dac4b81c298cb3ea6821ea312efa5375f42d5ccb
    with:
      gh-aw-version: v0.89.21
      workflows-directory: .github/workflows

  powershell:
    name: Analyze PowerShell
    uses: DevOpsDerek/workflows/.github/workflows/lint-powershell.yml@c4ac3847334c8944a48619ae4f3f0d622f4a074b
    with:
      psscriptanalyzer-version: 1.24.0
      working-directory: windows-golden-images
      settings-path: .github/workflows/lint/powershell-settings.psd1

  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: python -m pip install --user pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Validate supply-chain docs and workflow controls
        run: bash ./scripts/validate-supply-chain.sh

      - name: Validate Windows build controls without starting Windows runners
        run: bash ./scripts/validate-windows.sh

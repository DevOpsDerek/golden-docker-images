# Run pre-commit (all hooks: ShellCheck, Hadolint, yamllint, etc.) so CI matches local.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: python -m pip install --user pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Validate supply-chain documentation
        run: |
          chmod +x scripts/validate-supply-chain-docs.sh
          ./scripts/validate-supply-chain-docs.sh

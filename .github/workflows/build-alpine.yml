# Build and push golden Alpine images.
# Push runs on every merge to default branch and on monthly schedule (1st); optional Docker Hub via DOCKERHUB_NAMESPACE.
# Monthly schedule: CalVer tags (e.g. 3.18-2025-03).

name: Build Alpine Golden Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # First day of every month, 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

env:
  VERSIONS: "3.17 3.18 3.19 3.20"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: alpine-golden-images
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set CalVer (monthly run)
        if: github.event_name == 'schedule'
        run: echo "CALVER=$(date +%Y-%m)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          read -r -a versions <<< "$VERSIONS"
          for v in "${versions[@]}"; do
            docker build -t "alpine-golden:$v" "./$v"
          done

      - name: Test images
        run: ./tests/test.sh alpine-golden

      - name: Run Trivy vulnerability scanner
        run: |
          read -r -a versions <<< "$VERSIONS"
          for v in "${versions[@]}"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
              "alpine-golden:$v"
          done

      - name: Generate SBOMs
        run: |
          SBOM_DIR="$GITHUB_WORKSPACE/alpine-golden-images/sbom"
          mkdir -p "$SBOM_DIR"
          read -r -a versions <<< "$VERSIONS"
          for v in "${versions[@]}"; do
            docker run --rm -e SYFT_CHECK_FOR_APP_UPDATE=false -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/syft:v1.52.0@sha256:500e2d872ac019436926e8322b4fc1f39441d94d21f6f4046c6ff29b30e8cb02 "alpine-golden:$v" -o spdx-json \
              > "$SBOM_DIR/alpine-golden-$v.spdx.json"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alpine-golden-sbom
          path: alpine-golden-images/sbom/*.spdx.json
          if-no-files-found: error

      - name: Determine if push should run
        id: determine_push
        run: |
          if [[ "$EVENT" == "schedule" ]]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
            echo "Push: yes (scheduled run)"
            exit 0
          fi
          if [[ "$EVENT" != "push" && "$EVENT" != "workflow_dispatch" ]]; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            echo "Push: no (event is $EVENT)"
            exit 0
          fi
          ref_expected="refs/heads/${DEFAULT_BRANCH:-main}"
          if [[ "$GITHUB_REF" != "$ref_expected" ]]; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            echo "Push: no (ref $GITHUB_REF is not default branch $DEFAULT_BRANCH)"
            exit 0
          fi
          echo "should_push=true" >> "$GITHUB_OUTPUT"
          echo "Push: yes (merge to default branch)"
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Push to registry (only on merge to default branch or monthly schedule)
        if: steps.determine_push.outputs.should_push == 'true'
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          REPO_OWNER_LOWER="$(echo "$GITHUB_REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          GHCR_REGISTRY="${REGISTRY_GHCR:-ghcr.io/$REPO_OWNER_LOWER/alpine-golden}"
          read -r -a versions <<< "$VERSIONS"
          for v in "${versions[@]}"; do
            docker tag "alpine-golden:$v" "$GHCR_REGISTRY:$v"
            docker push "$GHCR_REGISTRY:$v"
            if [[ -n "${CALVER:-}" ]]; then
              docker tag "alpine-golden:$v" "$GHCR_REGISTRY:$v-$CALVER"
              docker push "$GHCR_REGISTRY:$v-$CALVER"
            fi
          done
          if [[ -n "${DOCKERHUB_NAMESPACE:-}" ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
            DOCKERHUB_REGISTRY="docker.io/${DOCKERHUB_NAMESPACE}/alpine-golden"
            for v in "${versions[@]}"; do
              docker tag "alpine-golden:$v" "$DOCKERHUB_REGISTRY:$v"
              docker push "$DOCKERHUB_REGISTRY:$v"
              if [[ -n "${CALVER:-}" ]]; then
                docker tag "alpine-golden:$v" "$DOCKERHUB_REGISTRY:$v-$CALVER"
                docker push "$DOCKERHUB_REGISTRY:$v-$CALVER"
              fi
            done
          fi
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          REGISTRY_GHCR: ${{ vars.REGISTRY_GHCR || '' }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || '' }}
          CALVER: ${{ env.CALVER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

# Build and optionally push golden Alpine images.
# Set REGISTRY and ENABLE_PUSH in repo vars if you want to push.

name: Build Alpine Golden Images

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VERSIONS: "3.17 3.18 3.19 3.20"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alpine-golden-images
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          for v in $VERSIONS; do
            docker build -t alpine-golden:$v ./$v
          done

      - name: Test images
        run: ./tests/test.sh alpine-golden

      - name: Run Trivy vulnerability scanner
        run: |
          for v in $VERSIONS; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
              alpine-golden:$v
          done

      - name: Push to registry (optional)
        if: env.ENABLE_PUSH == 'true' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          REGISTRY="${REGISTRY:-ghcr.io/${{ github.repository_owner }}/alpine-golden}"
          for v in $VERSIONS; do
            docker tag alpine-golden:$v $REGISTRY:$v
            docker push $REGISTRY:$v
          done
        env:
          ENABLE_PUSH: ${{ vars.ENABLE_PUSH || 'false' }}
          REGISTRY: ${{ vars.REGISTRY || '' }}

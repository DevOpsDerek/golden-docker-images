# Build and optionally push golden Rocky Linux images.
# Monthly schedule (1st): builds and pushes with CalVer tags (e.g. 9-2025-03).

name: Build Rocky Golden Images

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

env:
  VERSIONS: "8 9"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rocky-golden-images
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set CalVer (monthly run)
        if: github.event_name == 'schedule'
        run: echo "CALVER=$(date +%Y-%m)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          for v in $VERSIONS; do
            docker build -t rocky-golden:$v ./$v
          done

      - name: Test images
        run: ./tests/test.sh rocky-golden

      - name: Run Trivy vulnerability scanner
        run: |
          for v in $VERSIONS; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
              rocky-golden:$v
          done

      - name: Push to registry (only on merge to main/master or monthly schedule)
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.ENABLE_PUSH == 'true') || github.event_name == 'schedule'
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          GHCR_REGISTRY="${REGISTRY_GHCR:-ghcr.io/${{ github.repository_owner }}/rocky-golden}"
          for v in $VERSIONS; do
            docker tag rocky-golden:$v $GHCR_REGISTRY:$v
            docker push $GHCR_REGISTRY:$v
            if [[ -n "${CALVER:-}" ]]; then
              docker tag rocky-golden:$v $GHCR_REGISTRY:$v-$CALVER
              docker push $GHCR_REGISTRY:$v-$CALVER
            fi
          done
          if [[ -n "${DOCKERHUB_NAMESPACE:-}" ]]; then
            echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
            DOCKERHUB_REGISTRY="docker.io/$DOCKERHUB_NAMESPACE/rocky-golden"
            for v in $VERSIONS; do
              docker tag rocky-golden:$v $DOCKERHUB_REGISTRY:$v
              docker push $DOCKERHUB_REGISTRY:$v
              if [[ -n "${CALVER:-}" ]]; then
                docker tag rocky-golden:$v $DOCKERHUB_REGISTRY:$v-$CALVER
                docker push $DOCKERHUB_REGISTRY:$v-$CALVER
              fi
            done
          fi
        env:
          ENABLE_PUSH: ${{ vars.ENABLE_PUSH || 'false' }}
          REGISTRY_GHCR: ${{ vars.REGISTRY_GHCR || '' }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || '' }}
          CALVER: ${{ env.CALVER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

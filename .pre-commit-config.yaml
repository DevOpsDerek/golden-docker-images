# Pre-commit hooks: lint and fix before commit (repo root).
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: detect-private-key

  # Linters run in Docker — no need to install shellcheck, hadolint, or yamllint locally
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        language: docker_image
        types: [shell]
        entry: koalaman/shellcheck:stable
        args: [-x]

      - id: hadolint
        name: hadolint
        language: docker_image
        types: [dockerfile]
        entry: hadolint/hadolint
        args: [-c, .hadolint.yaml]

      - id: yamllint
        name: yamllint
        language: docker_image
        types: [yaml]
        entry: cytopia/yamllint:latest
        args: [-c, .yamllint.yml]

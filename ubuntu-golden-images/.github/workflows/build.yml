# Build and optionally push golden Ubuntu LTS images.
# Set REGISTRY (e.g. ghcr.io/owner/repo) in repo secrets/vars and
# enable push with ENABLE_PUSH or a manual workflow_dispatch.

name: Build Golden Images

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  VERSIONS: "18.04 20.04 22.04 24.04"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          for v in $VERSIONS; do
            docker build -t ubuntu-golden:$v ./$v
          done

      - name: Test images
        run: ./tests/test.sh ubuntu-golden

      - name: Push to registry (optional)
        if: env.ENABLE_PUSH == 'true' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          REGISTRY="${REGISTRY:-ghcr.io/${{ github.repository_owner }}/ubuntu-golden}"
          for v in $VERSIONS; do
            docker tag ubuntu-golden:$v $REGISTRY:$v
            docker push $REGISTRY:$v
          done
        env:
          ENABLE_PUSH: ${{ vars.ENABLE_PUSH || 'false' }}
          REGISTRY: ${{ vars.REGISTRY || '' }}

# Run ShellCheck, Hadolint, and yamllint on push and PR.

name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck -x build.sh tests/test.sh scripts/lint.sh

      - name: Hadolint
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt hadolint/hadolint hadolint -c .hadolint.yaml 18.04/Dockerfile 20.04/Dockerfile 22.04/Dockerfile 24.04/Dockerfile

      - name: yamllint
        run: |
          pip install yamllint
          yamllint -c .yamllint.yml .github/workflows/build.yml .github/workflows/lint.yml .yamllint.yml .hadolint.yaml .pre-commit-config.yaml
